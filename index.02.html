<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lightbox ex2</title>
    <link rel="stylesheet" href="css/main2.css">
    <script src="js/main2.js"></script>
  </head>
  <body>
    <div class="gallery">
      <img
        src="https://picsum.photos/id/1015/400/300"
        alt="images"
        class="pic"
        data-title="첫번째 이미지"
        data-src="https://picsum.photos/id/1015/800/600"
      />
      <img
        src="https://picsum.photos/id/1025/400/300"
        alt="images"
        class="pic"
        data-title="두번째 이미지"
        data-src="https://picsum.photos/id/1025/800/600"
      />
      <img
        src="https://picsum.photos/id/1035/400/300"
        alt="images"
        class="pic"
        data-title="세번째 이미지"
        data-src="https://picsum.photos/id/1035/800/600"
      />
    </div>
    <div id="lightBox">
        <p id="lightBox-title"></p>
      <img id="lightBox-img">
    
    </div>
  </body>
</html>
